<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>llmart</title>
    <meta name="description" content="Self-portraits painted by AI models, shown one at a time." />
    <meta name="theme-color" content="#050506" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050506'/%3E%3Crect x='10' y='6' width='12' height='15' rx='2' fill='%23f5f5f7'/%3E%3Crect x='10' y='23' width='12' height='4' rx='1' fill='%23f5f5f7' opacity='.25'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="search.js" defer></script>
    <script src="gallery.js" defer></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient__layer"></div>
      <div class="ambient__layer"></div>
    </div>

    <header class="topbar">
      <a class="wordmark" href="./">llm<span>art</span></a>
      <div class="topbar__end">
        <button
          class="icon-button topbar-button"
          type="button"
          aria-haspopup="dialog"
          aria-keyshortcuts="/ Control+K Meta+K"
          data-open-search
          aria-label="Search"
          title="Search (/)"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></svg>
        </button>
        <p class="counter" data-counter hidden>
          <span data-counter-current>01</span><span class="counter__sep">/</span><span data-counter-total>01</span>
        </p>
        <button class="icon-button topbar-button" type="button" aria-haspopup="dialog" data-open-settings aria-label="Settings" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
        </button>
      </div>
    </header>

    <main class="stage" data-stage>
      <div class="viewport" data-viewport></div>
    </main>

    <footer class="bottombar" data-bottombar hidden>
      <nav class="dock" aria-label="Gallery" data-dock hidden>
        <button class="nav-button nav-button--prev" type="button" data-prev aria-label="Previous piece">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
        </button>
        <div class="dots">
          <div class="dots__window" data-dots-window>
            <div class="dots__track" data-dots></div>
          </div>
        </div>
        <button class="nav-button nav-button--next" type="button" data-next aria-label="Next piece">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" /></svg>
        </button>
      </nav>
      <button class="faq-link" type="button" aria-haspopup="dialog" data-open-faq hidden>FAQ</button>
    </footer>

    <p class="visually-hidden" aria-live="polite" data-live></p>

    <dialog class="sheet" data-faq-dialog aria-labelledby="faq-heading">
      <div class="sheet__panel">
        <header class="sheet__header">
          <div>
            <p class="sheet__eyebrow">FAQ</p>
            <h2 class="sheet__title" id="faq-heading">About llmart</h2>
          </div>
          <button class="icon-button" type="button" data-close-faq aria-label="Close FAQ">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <!-- Filled from faq.md by the build. -->
        <div class="sheet__body faq" data-faq-body><!-- FAQ --></div>
      </div>
    </dialog>

    <dialog class="sheet" data-settings-dialog aria-labelledby="settings-heading">
      <div class="sheet__panel">
        <header class="sheet__header">
          <div>
            <p class="sheet__eyebrow">Settings</p>
            <h2 class="sheet__title" id="settings-heading">Gallery</h2>
          </div>
          <button class="icon-button" type="button" data-close-settings aria-label="Close settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="sheet__body settings">
          <label class="setting" data-setting-low-effort>
            <span class="setting__text">
              <span class="setting__label">Show low-effort pieces</span>
              <span class="setting__hint">
                Some models don't seem to put a reasonable amount of effort into their self-portrait.
                Those pieces are hidden unless this is on.
                <strong data-low-effort-list></strong>
              </span>
            </span>
            <input class="switch" type="checkbox" role="switch" data-toggle-low-effort />
          </label>
          <label class="setting" data-setting-stealth>
            <span class="setting__text">
              <span class="setting__label">Hide stealth models</span>
              <span class="setting__hint">
                A stealth model is tested anonymously under a codename before release, so which
                model painted it isn't known for sure.
                <strong data-stealth-list></strong>
              </span>
            </span>
            <input class="switch" type="checkbox" role="switch" data-toggle-hide-stealth />
          </label>
        </div>
      </div>
    </dialog>

    <dialog class="sheet search" data-search-dialog aria-label="Search the gallery">
      <div class="sheet__panel search__panel">
        <div class="search__field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></svg>
          <input
            class="search__input"
            type="text"
            role="combobox"
            aria-expanded="true"
            aria-controls="search-results"
            aria-autocomplete="list"
            aria-label="Search models or creators"
            placeholder="Search models or creators"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="go"
            autofocus
            data-search-input
          />
          <button class="icon-button" type="button" data-close-search aria-label="Close search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="search__body" data-search-body>
          <p class="search__empty" data-search-empty hidden></p>
          <!-- Filled by gallery.js the first time search opens: one group of tiles per creator. -->
          <div class="search__results" id="search-results" role="listbox" aria-label="Portraits" data-search-results></div>
        </div>
        <p class="visually-hidden" aria-live="polite" data-search-live></p>
        <p class="search__keys" aria-hidden="true">
          <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> move</span>
          <span><kbd>↵</kbd> view</span>
          <span><kbd>esc</kbd> close</span>
        </p>
      </div>
    </dialog>

    <noscript><p class="noscript">llmart needs JavaScript to show the gallery.</p></noscript>
    <!-- GALLERY_DATA -->
  </body>
</html>
